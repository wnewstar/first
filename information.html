<!DOCTYPE html>
<html>
<head>
    <title>information</title>
</head>
<style type="text/css">
.full-screen-bg {
  background-image: url('./A1.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  width: 100%;
  height: 100vh;
  margin: 0;
  padding: 0;
}
.data-span {
	display: inline-block;
	color: #eee;
	width: 80%;
	padding: 0;
	margin-left: 10%;
	height: 10vh;
	text-align: center;
	font-size: 2.8vh;
	font-style: italic;
	font-weight: 500;
	font-family: 'Roboto Mono', Consolas, 'Courier New';
	text-decoration: none;
}
</style>
<body class="full-screen-bg">
    <span class="data-span" id="data1" style="margin-top: 29.2vh;"></span>
    <span class="data-span" id="data2" style="margin-top: 0.30vh;"></span>
</body>
<script type="text/javascript">
	setTimeout(() => {
  		const param = new URLSearchParams(window.location.search)
		const data1 = param.get('data1')
		const data2 = param.get('data2')
		document.getElementById('data1').textContent = data1
		document.getElementById('data2').textContent = data2
	}, 1000)
</script>
</html>
