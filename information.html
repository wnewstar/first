<!DOCTYPE html>
<html>
<head>
    <title>information</title>
</head>
<style type="text/css">
.full-screen-bg {
  background-image: url('./A1.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  width: 100%;
  height: 100vh;
  margin: 0;
  padding: 0;
}
.data-span-1 {
	display: inline-block;
	color: #eee;
	width: 80%;
	padding: 0;
	margin-left: 10%;
	height: 5vh;
	text-align: center;
	font-size: 2.4vh;
	font-style: italic;
	font-weight: 700;
	font-family: 'Roboto Mono', Consolas, 'Courier New';
	letter-spacing: 0.1em;
	text-decoration: none;
}
.data-span-2 {
	display: inline-block;
	color: #eee;
	width: 80%;
	padding: 0;
	margin-left: 10%;
	height: 5vh;
	text-align: center;
	font-size: 2.8vh;
	font-style: italic;
	font-weight: 500;
	font-family: Arial, Helvetica, sans-serif;
  	font-weight: normal;
  	text-transform: uppercase;
  	letter-spacing: 0.1em;
	text-decoration: none;
}
</style>
<body class="full-screen-bg">
    <span class="data-span-1" id="data1" style="margin-top: 30.2vh;"></span>
    <span class="data-span-1" id="data2" style="margin-top: 5.10vh;"></span>
    <span class="data-span-2" id="data3" style="margin-top: 15.00vh;"></span>
</body>
<script type="text/javascript">
	setTimeout(() => {
  		const param = new URLSearchParams(window.location.search)
		const data1 = param.get('a')
		const data2 = param.get('b')
		const data3 = param.get('c')
		document.getElementById('data1').textContent = data1
		document.getElementById('data2').textContent = data2
		document.getElementById('data3').textContent = data3
	}, 1000)
</script>
</html>
